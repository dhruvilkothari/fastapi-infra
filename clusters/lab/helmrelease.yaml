
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fastapi
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./charts/fastapi
      version: "*"
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: fastapi-infra
        namespace: flux-system
      interval: 1m

